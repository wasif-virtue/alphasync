<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AlphaSync 360 Solutions</title>
    <meta name="title" content="AlphaSync" />
    <meta
      name="description"
      content="AlphaSync is a forward-thinking software company specializing in next-generation Artificial Intelligence and digital innovation."
    />
    <link rel="shortcut icon" href="favicon.png" type="image/png+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="preload" as="image" href="hero-bg.jpg" />
    <link rel="preload" as="image" href="hero-slide-1.jpg" />
    <link rel="preload" as="image" href="hero-slide-2.jpg" />
    <link rel="preload" as="image" href="hero-slide-3.jpg" />
  </head>
  <body>
    <!-- header -->
    <header class="header">
      <div class="container">
        <a href="#" class="logo">
          <!-- <h2>Alphasync 360 Solutions</h2> -->
          <img
            src="logo-light.svg"
            width="74"
            height="24"
            alt="AlphaSync home"
            class="logo-light"
          />
          <img
            src="logo-dark.svg"
            width="74"
            height="24"
            alt="AlphaSync home"
            class="logo-dark"
          />
        </a>

        <nav class="navbar" data-navbar>
          <div class="navbar-top">
            <a href="" class="logo">
              <img
                src="logo-light.svg"
                width="74"
                height="24"
                alt="AlphaSync home"
              />
            </a>
            <button
              class="nav-close-btn"
              aria-label="close menu"
              data-nav-toggler
            >
              <ion-icon name="close-outline" aria-hidden="true"></ion-icon>
            </button>
          </div>

          <div class="navbar-list">
            <li>
              <a href="#" class="navbar-link">Home</a>
              <a href="#" class="navbar-link">About</a>
              <a href="#" class="navbar-link">Services</a>
              <a href="#" class="navbar-link">Projects</a>
              <a href="#" class="navbar-link">Contact</a>
            </li>
          </div>

          <div class="wrapper">
            <a href="mailto:writers@alphasync.us" class="contact-link"
              >writers@alphasync.us</a
            >
            <a href="tel:+923378635755" class="contact-link">+92 337 8635755</a>
          </div>

          <ul class="social-list">
            <li>
              <a href="" class="social-link">
                <ion-icon name="logo-twitter"></ion-icon>
              </a>
            </li>
            <li>
              <a href="" class="social-link">
                <ion-icon name="logo-facebook"></ion-icon>
              </a>
            </li>
            <li>
              <a href="" class="social-link">
                <ion-icon name="logo-dribbble"></ion-icon>
              </a>
            </li>
            <li>
              <a href="" class="social-link">
                <ion-icon name="logo-instagram"></ion-icon>
              </a>
            </li>
            <li>
              <a href="" class="social-link">
                <ion-icon name="logo-youtube"></ion-icon>
              </a>
            </li>
          </ul>
        </nav>

        <a href="#" class="btn btn-primary">Contact Us</a>
        <button class="nav-open-btn" aria-label="open menu" data-nav-toggler>
          <ion-icon name="menu-outline" aria-hidden="true"></ion-icon>
        </button>

        <div class="overlay" data-nav-toggler data-overlay></div>
      </div>
    </header>

    <main>
      <article>
        <section
      
          class="section hero has-bg-image"
          aria-label="home"
          style="background-image: url(&quot;hero-bg.jpg&quot;)"
        >
          <div class="container">
            <div class="hero-content">
              <h1 class="h1 hero-title">
                Crafting project specific solutions with expertise.
              </h1>
              <p class="hero-text">
                We’re a creative company that focuses on establishing long-term
                relationships with customers.
              </p>
              <div class="btn-wrapper">
                <a href="#" class="btn btn-primary">Explore Now</a>

                <a href="#" class="btn btn-outline">Contact Ua</a>
              </div>
            </div>

            <div class="hero-slider" data-slider>
              <div class="slider-inner">
                <ul class="slider-container" data-slider-container>
                  <li class="slider-item">
                    <figure
                      class="img-holder"
                      style="--width: 575; --height: 550"
                    >
                      <img
                        src="hero-slide-1.jpg"
                        width="575"
                        height="550"
                        alt="hero banner"
                        class="img-cover"
                      />
                    </figure>
                  </li>
                  <li class="slider-item">
                    <div class="hero-card">
                      <figure
                        class="img-holder"
                        style="--width: 575; --height: 550"
                      >
                        <img
                          src="hero-slide-2.jpg"
                          width="575"
                          height="550"
                          alt="hero-banner"
                          class="img-cover"
                        />
                      </figure>

                      <button class="play-btn" aria-label="play adex intro">
                        <ion-icon name="play" aria-hidden="true"></ion-icon>
                      </button>
                    </div>
                  </li>
                  <li class="slider-item">
                    <figure
                      class="img-holder"
                      style="--width: 575; --height: 550"
                    >
                      <img
                        src="hero-slide-3.jpg"
                        width="575"
                        height="550"
                        alt="hero banner"
                        class="img-cover"
                      />
                    </figure>
                  </li>
                </ul>
              </div>

              <button
                class="slider-btn prev"
                aria-label="slide to previous"
                data-slider-prev
              >
                <ion-icon name="arrow-back"></ion-icon>
              </button>
              <button
                class="slider-btn next"
                aria-label="slide to next"
                data-slider-next
              >
                <ion-icon name="arrow-forward"></ion-icon>
              </button>
            </div>
          </div>
        </section>
      </article>
    </main>

    <script src="script.js"></script>
    <script
      type="module"
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"
    ></script>
  </body>
</html>
